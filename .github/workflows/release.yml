name: Release (Windows exe)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # Pinned rather than windows-latest: the Flutter toolchain flet build
    # windows drives (currently stable 3.29.2) picks the CMake generator
    # string for whatever Visual Studio it finds via a version lookup table
    # that only goes up to VS2022 — a newer VS on windows-latest gets
    # misread and it falls back to a hardcoded "Visual Studio 16 2019",
    # which then fails outright since no such version is installed at all.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Version/metadata check
        run: python -m pytest -q -k test_packaging_metadata

      - name: Lint
        run: python -m ruff check .

      - name: Test
        env:
          CI: "1"
        run: python -m pytest -q

      - name: flet build windows
        env:
          # flet build's progress output goes through `rich`, which writes
          # box-drawing/bullet characters (e.g. ●); the Windows runner's
          # console defaults to cp1252, which can't encode those and the
          # build dies on a UnicodeEncodeError before it does anything.
          # PYTHONUTF8 forces UTF-8 mode so Python's own stdout/stderr
          # encoding is used instead of the console's codepage.
          PYTHONUTF8: "1"
        run: flet build windows

      - name: Verify exe
        shell: pwsh
        run: |
          if (-not (Test-Path "build\windows\Centurio.exe")) {
            throw "build\windows\Centurio.exe not found after flet build"
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer\centurio.iss

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path app\__init__.py -Pattern '__version__\s*=\s*"([\d.]+)"'
          "version=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Centurio-${{ steps.version.outputs.version }}-exe
          path: build/windows/Centurio.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Centurio-${{ steps.version.outputs.version }}-setup
          path: installer/Output/CenturioSetup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/Centurio.exe
            installer/Output/CenturioSetup.exe
          generate_release_notes: true
