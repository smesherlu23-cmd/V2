name: Build Windows

# Сборка Windows-релиза Centurio.
#
# Собирает PyInstaller'ом в одну папку (`flet pack -D`), проверяет, что
# собранное вообще запускается, и только потом пакует в установщик Inno Setup
# и в zip.
#
# Flutter, Visual Studio и CMake тут не нужны: раньше `flet build windows`
# требовал весь этот тулчейн и пин на образ windows-2022 (на windows-latest
# уже Visual Studio 2026, генераторов для которой Flutter 3.29.2 не знает),
# хотя итогом всё равно была папка, которую упаковывает Inno Setup. PyInstaller
# делает такую же папку одним питоном.
#
# Выпускает:
#   CenturioSetup-<версия>.exe       установщик — один файл, что и отправлять
#   Centurio-<версия>-portable.zip   та же сборка без установки

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (по умолчанию v<версия из app/__init__.py>)"
        required: false
        type: string
      prerelease:
        description: "Пометить релиз как предварительный"
        required: false
        default: true
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # flet_cli.commands.build создаёт rich-консоль прямо на импорте модуля:
      # force_terminal = not FLET_CLI_NO_RICH_OUTPUT. Флаг --no-rich-output
      # разбирается позже, когда консоль уже построена, поэтому помогает только
      # переменная. Без неё rich считает пайп раннера терминалом, уходит в
      # legacy-windows рендер и падает на '●' — UnicodeEncodeError в cp1252.
      FLET_CLI_NO_RICH_OUTPUT: "true"
      # Стандартный вывод питона на раннере — cp1252, а юникода хватает и
      # помимо rich: в логах приложения он весь русский.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff "pyinstaller==6.22.0"

      - name: Версия и тег
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path 'app/__init__.py' -Pattern '__version__\s*=\s*"([\d.]+)"'
          if (-not $match) { throw 'Не удалось прочитать __version__ из app/__init__.py.' }
          $version = $match.Matches[0].Groups[1].Value

          # Тег берём из входа, иначе из пуша тега, иначе из версии в коде.
          $tag = $env:INPUT_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { "v$version" }
          }

          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Centurio $version -> релиз $tag"

      # Те же проверки, что гоняет scripts\build_release.ps1: рассогласование
      # версий между app/__init__.py, pyproject.toml и installer\centurio.iss
      # дало бы установщик с чужой версией в заголовке.
      - name: Проверки (метаданные, линтер, тесты)
        env:
          CI: "1"
        run: |
          python -m pytest -q -k test_packaging_metadata
          if ($LASTEXITCODE -ne 0) { throw "Проверка версии/метаданных не прошла ($LASTEXITCODE)." }
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { throw "ruff не прошёл ($LASTEXITCODE)." }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "pytest не прошёл ($LASTEXITCODE)." }

      # -D — сборка в папку, а не в один файл. Один файл каждый запуск
      # распаковывает себя в %TEMP%\_MEIxxxx, и именно это ловят эвристики
      # антивирусов; папка так не делает и стартует быстрее.
      # pynput выбирает бэкенд через importlib.import_module, статический анализ
      # PyInstaller его не видит — отсюда --hidden-import. ASSETS_DIR считается
      # как <корень>/assets относительно app/main.py, поэтому assets кладём
      # рядом тем же деревом.
      - name: Сборка (flet pack)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          flet pack main.py -y -D `
            --name Centurio `
            --icon assets/icon.png `
            --add-data "assets;assets" `
            --hidden-import pynput.keyboard._win32 pynput.mouse._win32 pystray._win32 `
            --product-name Centurio `
            --company-name Centurio `
            --file-description "Centurio — панель запуска приложений" `
            --product-version $env:VERSION `
            --file-version "$($env:VERSION).0"
          if ($LASTEXITCODE -ne 0) { throw "flet pack завершился с кодом $LASTEXITCODE." }
          if (-not (Test-Path 'dist\Centurio\Centurio.exe')) {
            throw 'Ожидал dist\Centurio\Centurio.exe после сборки, но его нет.'
          }

      # Собранное должно хотя бы подниматься. Без этого шага в релиз уже уехала
      # версия, которая молча закрывалась при старте.
      - name: Проверить, что запускается
        env:
          CENTURIO_DEBUG: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:APPDATA 'Centurio\centurio.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath 'dist\Centurio\Centurio.exe' -PassThru
          Start-Sleep -Seconds 25
          $exitedEarly = $proc.HasExited
          $code = if ($exitedEarly) { $proc.ExitCode } else { $null }
          if (-not $exitedEarly) {
            $proc.Kill()
            $proc.WaitForExit(5000) | Out-Null
          }

          # Лог печатаем всегда: на нём же разбираются падения.
          if (Test-Path $log) {
            Write-Host '--- centurio.log ---'
            Get-Content $log -Encoding utf8 | Select-Object -Last 100
            Write-Host '--- конец centurio.log ---'
          } else {
            Write-Host 'centurio.log не создан — падение раньше log.setup().'
          }

          if ($exitedEarly) {
            throw "Centurio.exe завершился сам за 25 с (код $code) — сборка не запускается."
          }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'CRITICAL' -Quiet)) {
            throw 'В centurio.log есть CRITICAL — необработанное исключение при старте.'
          }
          Write-Host 'Приложение поднялось и держалось 25 с.'

      - name: Установщик (Inno Setup)
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.Source }
          if (-not $iscc) { $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $iscc) {
            Write-Host 'Inno Setup не найден — ставлю через choco.'
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe не найден даже после установки Inno Setup.' }

          & $iscc 'installer\centurio.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE." }
          if (-not (Test-Path 'installer\Output\CenturioSetup.exe')) {
            throw 'Ожидал installer\Output\CenturioSetup.exe, но его нет.'
          }

      - name: Сложить артефакты
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'release' | Out-Null
          Copy-Item 'installer\Output\CenturioSetup.exe' "release\CenturioSetup-$($env:VERSION).exe"
          Compress-Archive -Path 'dist\Centurio\*' `
            -DestinationPath "release\Centurio-$($env:VERSION)-portable.zip" -Force
          Get-ChildItem 'release' -File |
            Select-Object Name, @{n='МБ';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: centurio-windows-${{ steps.meta.outputs.version }}
          path: release/*
          if-no-files-found: error

      # Публикуем только с тега или ручного запуска.
      - name: Публикация релиза
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Ненулевой код gh release view здесь — норма (релиза ещё нет), так что
          # ошибки нативных команд не должны валить шаг сами по себе.
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $files = @(Get-ChildItem 'release' -File | ForEach-Object { $_.FullName })

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Релиз $env:TAG уже есть — обновляю файлы."
            gh release upload $env:TAG @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload завершился с кодом $LASTEXITCODE." }
            return
          }

          $notes = @(
            "Сборка Centurio $($env:VERSION) из коммита $($env:GITHUB_SHA)."
            ""
            "- **CenturioSetup-$($env:VERSION).exe** — установщик: ставит Centurio, кладёт"
            "  ярлык в меню «Пуск», по желанию включает автозапуск. Это и есть тот файл,"
            "  который проще всего отправить на тесты."
            "- **Centurio-$($env:VERSION)-portable.zip** — та же сборка без установки:"
            "  распаковать и запустить Centurio.exe."
            ""
            "Настройки в обоих случаях лежат в %APPDATA%\Centurio, там же centurio.log."
          ) -join "`n"
          Set-Content -Path 'release-notes.md' -Value $notes -Encoding utf8

          # С ручного запуска решает галка, с тега — суффикс вида v1.2.0-rc1.
          $prerelease = if ([string]::IsNullOrWhiteSpace($env:PRERELEASE)) {
            $env:TAG -match '-'
          } else {
            $env:PRERELEASE -eq 'true'
          }
          $extra = @()
          if ($prerelease) { $extra += '--prerelease' }

          gh release create $env:TAG @files `
            --target $env:GITHUB_SHA `
            --title "Centurio $($env:VERSION)" `
            --notes-file 'release-notes.md' `
            @extra
          if ($LASTEXITCODE -ne 0) { throw "gh release create завершился с кодом $LASTEXITCODE." }
